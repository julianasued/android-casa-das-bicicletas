name: casa_das_bicicletas
description: "Aplicativo de vendas e caixa para terminais Elgin M10 Pro."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Ponte com os periféricos do M10 Pro (SDK E1 da Elgin). Pacote local: o
  # plugin é específico deste terminal e não tem por que sair do repositório.
  elgin_m10:
    path: packages/elgin_m10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
