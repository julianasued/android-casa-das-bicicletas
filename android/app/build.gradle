plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "br.com.casadasbicicletas.vendas"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "br.com.casadasbicicletas.vendas"
        // O Elgin M10 Pro roda Android 11 (API 30); 24 mantém margem para
        // outros terminais de teste.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: substituir pela assinatura de release antes da distribuição.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Armazenamento seguro do token do terminal (§12 da integração com o M10):
    // EncryptedSharedPreferences com chave no Keystore do Android.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // SDKs da Elgin. Os arquivos são distribuídos pelo fabricante, não estão em
    // repositório público e não são versionados aqui — coloque-os em
    // `android/app/libs/` (ver libs/README.md). O exemplo oficial do M8/M10
    // usa exatamente estas duas linhas de fileTree.
    // Sem os arquivos o projeto compila do mesmo jeito, e a impressora responde
    // PRINTER_UNAVAILABLE — o caso previsto no §11 da especificação.
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Dependência que a documentação oficial do E1 Android lista como exigida
    // (elgindevelopercommunity.github.io, "Linha PosGo e M10"), e que o exemplo
    // oficial em Flutter também declara.
    implementation "androidx.startup:startup-runtime:1.1.0"

    // A documentação do E1 lista também ZXing e RxJava/RxAndroid. O exemplo
    // oficial em Flutter do M8/M10 **não** os declara e ainda assim funciona,
    // então eles não entram enquanto não houver necessidade comprovada: este
    // aplicativo não decodifica código por câmera, e acrescentar biblioteca sem
    // uso é peso morto no APK do terminal.
    //
    // Se o `.aar` do E1 falhar em tempo de execução com NoClassDefFoundError
    // apontando para `com.google.zxing` ou `io.reactivex`, descomente:
    //
    // implementation "com.google.zxing:core:3.4.0"
    // implementation "io.reactivex.rxjava2:rxjava:2.1.8"
    // implementation "io.reactivex.rxjava2:rxandroid:2.0.1"
}
