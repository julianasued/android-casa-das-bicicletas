plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "br.com.casadasbicicletas.vendas"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "br.com.casadasbicicletas.vendas"
        // O Elgin M10 Pro roda Android 11 (API 30); 24 mantém margem para
        // outros terminais de teste.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: substituir pela assinatura de release antes da distribuição.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Armazenamento seguro do token do terminal (§12 da integração com o M10):
    // EncryptedSharedPreferences com chave no Keystore do Android.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // SDK da impressora térmica da Elgin. O .aar é distribuído pelo fabricante
    // e não está em repositório público nem versionado aqui — coloque-o em
    // `android/app/libs/` (ver libs/README.md). Sem ele o projeto compila do
    // mesmo jeito, e a impressora responde PRINTER_UNAVAILABLE, que é o caso
    // previsto no §11 da especificação de integração.
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
}
