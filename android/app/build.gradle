plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "br.com.casadasbicicletas.vendas"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "br.com.casadasbicicletas.vendas"
        // O Elgin M10 Pro roda Android 11 (API 30); 24 mantém margem para
        // outros terminais de teste.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: substituir pela assinatura de release antes da distribuição.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
